name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack engine.zip
        run: |
          if [ -f engine.zip ]; then rm -rf app_src && mkdir app_src && unzip -o engine.zip -d app_src; else echo "engine.zip not found" && exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Android SDK pieces
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - name: Build
        working-directory: app_src
        run: gradle assembleRelease --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" app_src/build/outputs/apk/release/*.apk \
            --title "Build ${{ github.run_number }}" --notes "Engine stage 1"
